<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio | Project Bob</title>
    <meta name="description" content="Launch the Project Bob studio experience." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="container nav-wrap">
          <a class="brand" href="index.html"><span class="brand-mark">✦</span><span>Project Bob</span></a>
          <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="studio.html" class="active">Studio</a>
            <a href="color-by-number.html">Color by Number</a>
            <a href="gallery.html">Gallery</a>
            <a href="pricing.html">Pricing</a>
            <a href="tutorials.html">Tutorials</a>
            <a href="about.html">About</a>
            <a href="roadmap.html">Roadmap</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html">Contact</a>
          </nav>
          <div class="nav-actions">
            <a href="login.html" class="link-btn">Log in</a>
            <a href="color-by-number.html" class="primary-btn">Open Color Studio</a>
          </div>
        </div>
      </header>

      <main>
        <section class="studio-page">
          <div class="container studio-layout">
            <aside class="studio-sidebar">
              <div class="panel-block">
                <span class="eyebrow">Studio controls</span>
                <h2>Live tools</h2>
              </div>
              <div class="tool-group">
                <button class="tool-item active">Pencil</button>
                <button class="tool-item">Eraser</button>
                <button class="tool-item">Outline</button>
                <button class="tool-item">Enhance</button>
                <a href="color-by-number.html" class="tool-item accent-tool">Color by Number</a>
              </div>
              <div class="tool-group compact">
                <label>Size <input type="range" min="1" max="40" value="6" /></label>
                <label>Opacity <input type="range" min="10" max="100" value="70" /></label>
                <label>Zoom <input type="range" min="25" max="300" value="100" /></label>
              </div>
              <a href="pricing.html" class="primary-btn full">Upgrade workspace</a>
            </aside>

            <div class="studio-stage">
              <div class="studio-topbar">
                <span>Canvas</span>
                <div class="stage-actions">
                  <button class="secondary-btn">Fit</button>
                  <button class="secondary-btn">Save</button>
                </div>
              </div>
              <div class="studio-canvas-wrap">
                <div class="studio-canvas">
                  <div class="trace-layer"></div>
                  <div class="draw-layer"></div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container footer-wrap">
          <div><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>Project Bob</span></a></div>
          <div class="footer-links"><a href="features.html">Features</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a></div>
          <p>© 2026 Project Bob</p>
        </div>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
