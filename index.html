<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Project Bob</title>
    <style>
      :root {
        --bg: #edf3ff;
        --bg-strong: #dfe9ff;
        --panel: rgba(15, 23, 42, 0.85);
        --panel-soft: rgba(255, 255, 255, 0.72);
        --panel-border: rgba(148, 163, 184, 0.35);
        --text: #0f172a;
        --text-soft: #475569;
        --primary: #4f46e5;
        --primary-strong: #4338ca;
        --accent: #14b8a6;
        --accent-soft: #b8f7ef;
        --warning: #f59e0b;
        --danger: #ef4444;
        --shadow: 0 18px 35px rgba(15, 23, 42, 0.12);
        --radius: 18px;
      }

      * { box-sizing: border-box; }

      html, body {
        height: 100%;
        margin: 0;
        font-family: Inter, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(79, 70, 229, 0.10), transparent 28%),
          linear-gradient(180deg, var(--bg), #f8fbff 45%, var(--bg-strong));
        color: var(--text);
      }

      body {
        overflow: hidden;
      }

      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px 14px 10px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-radius: var(--radius);
        background: rgba(15, 23, 42, 0.9);
        color: white;
        box-shadow: var(--shadow);
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #8b5cf6, var(--primary));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.28);
        font-size: 20px;
      }

      .brand-title {
        font-weight: 800;
        letter-spacing: 0.02em;
        font-size: clamp(1.1rem, 2vw, 1.5rem);
      }

      .brand-sub {
        color: rgba(255,255,255,0.72);
        font-size: 0.78rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        background: rgba(255,255,255,0.56);
        backdrop-filter: blur(14px);
        box-shadow: 0 10px 24px rgba(15,23,42,0.08);
      }

      .toolbar-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .tool-btn,
      .secondary-btn,
      .primary-btn,
      select,
      input[type="number"],
      input[type="range"] {
        font: inherit;
      }

      .tool-btn,
      .secondary-btn,
      .primary-btn {
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      .tool-btn:hover,
      .secondary-btn:hover,
      .primary-btn:hover {
        transform: translateY(-1px);
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: white;
        box-shadow: 0 10px 18px rgba(79, 70, 229, 0.22);
      }

      .secondary-btn {
        background: rgba(15, 23, 42, 0.05);
        color: var(--text);
        border: 1px solid rgba(15,23,42,0.08);
      }

      .secondary-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .control {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(255,255,255,0.42);
        border: 1px solid rgba(148,163,184,0.22);
        color: var(--text-soft);
      }

      .control label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-soft);
      }

      select,
      input[type="number"] {
        border: 1px solid rgba(148,163,184,0.4);
        border-radius: 10px;
        background: white;
        color: var(--text);
        padding: 8px 10px;
      }

      input[type="range"] {
        accent-color: var(--primary);
      }

      .workspace-shell {
        position: relative;
        flex: 1;
        min-height: 260px;
        background: rgba(15, 23, 42, 0.06);
        border-radius: 20px;
        border: 1px solid rgba(148,163,184,0.22);
        overflow: hidden;
      }

      #workspace {
        position: absolute;
        inset: 0;
        overflow: auto;
        background:
          linear-gradient(90deg, rgba(148,163,184,0.08) 1px, transparent 1px),
          linear-gradient(rgba(148,163,184,0.08) 1px, transparent 1px),
          linear-gradient(180deg, rgba(255,255,255,0.2), rgba(203,213,225,0.14));
        background-size: 24px 24px, 24px 24px, 100% 100%;
      }

      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 260px;
        min-height: 240px;
      }

      .layer {
        display: block;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 18px;
        box-shadow: 0 24px 40px rgba(15, 23, 42, 0.18);
        background: rgba(255,255,255,0.35);
      }

      #reference {
        border: 1px solid rgba(15,23,42,0.09);
      }

      #drawing {
        border: 1px solid rgba(15,23,42,0.12);
        cursor: crosshair;
      }

      .feature-panel {
        position: absolute;
        right: 16px;
        top: 16px;
        width: min(260px, calc(100% - 32px));
        padding: 14px 12px 8px;
        border-radius: 14px;
        border: 1px solid rgba(15,23,42,0.1);
        background: rgba(255,255,255,0.7);
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 22px rgba(15, 23, 42, 0.08);
      }

      .feature-panel summary {
        padding: 6px 6px 8px;
        font-weight: 700;
        color: var(--text);
        cursor: pointer;
        list-style: none;
      }

      .feature-panel summary::-webkit-details-marker { display: none; }

      .feature-list {
        display: grid;
        gap: 8px;
        padding: 0 4px 4px;
      }

      .check-item {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-soft);
        font-weight: 600;
      }

      .toast {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%) translateY(18px);
        background: rgba(15,23,42,0.9);
        color: white;
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 0.82rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 700px) {
        .app {
          padding: 10px 10px 8px;
        }

        .toolbar {
          gap: 8px;
          justify-content: flex-start;
          padding: 10px;
        }

        .topbar {
          padding: 10px 12px;
        }

        .brand-sub {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark" aria-hidden="true">✏️</div>
          <div>
            <div class="brand-title">Project Bob</div>
            <div class="brand-sub">A cleaner tracing studio for creative work</div>
          </div>
        </div>
        <button id="saveBtn" class="primary-btn" type="button">Save PNG</button>
      </header>

      <div class="toolbar">
        <div class="toolbar-group">
          <button id="upload" class="tool-btn primary-btn" type="button">Add picture</button>
          <input id="file" type="file" accept="image/*" hidden />

          <label class="control" for="tool">
            <span>Tool</span>
            <select id="tool">
              <option value="pencil">Pencil</option>
              <option value="eraser">Eraser</option>
            </select>
          </label>

          <label class="control" for="strokeWidth">
            <span>Stroke</span>
            <input id="strokeWidth" type="range" min="1" max="20" value="4" />
          </label>
        </div>

        <div class="toolbar-group">
          <label class="control" for="scaleNumber">
            <span>Scale</span>
            <input id="scaleNumber" type="number" min="10" max="3000" step="10" value="100" />
            <span>%</span>
          </label>

          <label class="control" for="opacity">
            <span>Image</span>
            <input id="opacity" type="range" min="0" max="1" step="0.01" value="0.7" />
          </label>

          <label class="control" for="contrast">
            <span>Contrast</span>
            <input id="contrast" type="range" min="0.5" max="2.5" step="0.05" value="1.2" />
          </label>
        </div>

        <div class="toolbar-group">
          <button id="fitBtn" class="secondary-btn" type="button">Fit</button>
          <button id="undo" class="secondary-btn" type="button" disabled>Undo</button>
          <button id="redo" class="secondary-btn" type="button" disabled>Redo</button>
          <button id="clear" class="secondary-btn" type="button">Clear</button>
        </div>
      </div>

      <div id="workspace" class="workspace-shell" aria-label="Project Bob tracing workspace">
        <div id="stage">
          <canvas id="reference" class="layer" aria-label="Reference image layer"></canvas>
          <canvas id="drawing" class="layer" tabindex="0" aria-label="Drawing layer"></canvas>
        </div>

        <aside id="featurePanel" class="feature-panel">
          <details open>
            <summary>Reference tools</summary>
            <div class="feature-list">
              <label class="check-item"><input id="edge" type="checkbox" /> Edge tracing</label>
              <label class="check-item"><input id="mirror" type="checkbox" /> Mirror</label>
              <label class="check-item"><input id="stencil" type="checkbox" /> Stencil</label>
              <label class="check-item"><input id="ghost" type="checkbox" /> Ghost guide</label>
              <label class="check-item"><input id="crosshair" type="checkbox" /> Crosshair</label>
            </div>
          </details>
        </aside>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </div>
    </main>

    <script>
      (() => {
        const $ = (selector) => document.querySelector(selector);
        const ref = $('#reference');
        const draw = $('#drawing');
        const stage = $('#stage');
        const ws = $('#workspace');
        const refCtx = ref.getContext('2d');
        const ctx = draw.getContext('2d');

        let image = null;
        let sourceData = '';
        let zoom = 1;
        let baseScale = 1;
        let active = false;
        let moving = false;
        let start = null;
        let history = [];
        let redoStack = [];
        let pointerMap = new Map();
        let currentGuide = null;
        let ghostTimer = null;
        let keepAwake = false;

        const MIN_SCALE = 0.2;
        const MAX_SCALE = 8;

        function say(message) {
          const toast = $('#toast');
          toast.textContent = message;
          toast.classList.add('show');
          clearTimeout(say.timer);
          say.timer = setTimeout(() => toast.classList.remove('show'), 1800);
        }

        function currentScale() {
          return zoom * baseScale;
        }

        function saveLocal() {
          try {
            const data = {
              image: sourceData,
              zoom,
              opacity: $('#opacity').value,
              contrast: $('#contrast').value,
              drawing: draw.toDataURL('image/png')
            };
            localStorage.setItem('project-bob-session', JSON.stringify(data));
          } catch (error) {
            console.warn('Could not save to localStorage', error);
          }
        }

        function autosave() {
          saveLocal();
        }

        function pointFromEvent(e) {
          const rect = draw.getBoundingClientRect();
          return {
            x: (e.clientX - rect.left) * (draw.width / rect.width),
            y: (e.clientY - rect.top) * (draw.height / rect.height)
          };
        }

        function pushHistory() {
          try {
            history.push(ctx.getImageData(0, 0, draw.width, draw.height));
            if (history.length > 24) history.shift();
            redoStack = [];
            $('#undo').disabled = history.length === 0;
            $('#redo').disabled = true;
          } catch (error) {
            console.warn('Could not save drawing history', error);
          }
        }

        function restoreHistory(snapshot) {
          if (!snapshot) return;
          ctx.putImageData(snapshot, 0, 0);
        }

        function clearCanvas() {
          pushHistory();
          ctx.clearRect(0, 0, draw.width, draw.height);
          autosave();
          say('Canvas cleared');
        }

        function fitImageToStage() {
          if (!image) return;
          const maxW = ws.clientWidth * 0.9;
          const maxH = ws.clientHeight * 0.8;
          const scale = Math.min(maxW / image.width, maxH / image.height, 1.8);
          baseScale = scale;
          zoom = 1;
          updateStage();
          ws.scrollTo({ top: 0, left: 0, behavior: 'instant' });
          autosave();
          say('Picture fitted to workspace');
        }

        function setZoom(value, anchorX = ws.clientWidth / 2, anchorY = ws.clientHeight / 2) {
          const oldScale = currentScale();
          const newZoom = Math.max(MIN_SCALE, Math.min(MAX_SCALE, baseScale * value)) / baseScale;
          const currentLeft = ws.scrollLeft + anchorX;
          const currentTop = ws.scrollTop + anchorY;
          zoom = newZoom;
          updateStage();
          const targetLeft = (currentLeft / oldScale) * currentScale();
          const targetTop = (currentTop / oldScale) * currentScale();
          ws.scrollLeft = Math.max(0, targetLeft - anchorX);
          ws.scrollTop = Math.max(0, targetTop - anchorY);
          $('#scaleNumber').value = Math.round(currentScale() * 100);
        }

        function resizeCanvas(width, height, preserve = true) {
          let old = null;
          if (preserve && draw.width) {
            old = document.createElement('canvas');
            old.width = draw.width;
            old.height = draw.height;
            old.getContext('2d').drawImage(draw, 0, 0);
          }

          draw.width = width;
          draw.height = height;
          ref.width = width;
          ref.height = height;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = Number($('#strokeWidth').value);

          if (old) {
            ctx.drawImage(old, 0, 0);
          }

          drawReference();
          autosave();
        }

        function processedReference() {
          if (!image) return null;
          const canvas = document.createElement('canvas');
          canvas.width = ref.width;
          canvas.height = ref.height;
          const x = canvas.getContext('2d');
          x.filter = `contrast(${$('#contrast').value})`;
          x.save();
          if ($('#mirror').checked) {
            x.translate(canvas.width, 0);
            x.scale(-1, 1);
          }
          x.drawImage(image, 0, 0, canvas.width, canvas.height);
          x.restore();
          return canvas;
        }

        function drawReference() {
          refCtx.clearRect(0, 0, ref.width, ref.height);
          if (!image) return;

          const c = processedReference();
          if (!c) return;

          refCtx.globalAlpha = Number($('#opacity').value);
          refCtx.drawImage(c, 0, 0, ref.width, ref.height);
          refCtx.globalAlpha = 1;

          if ($('#edge').checked) {
            refCtx.save();
            refCtx.filter = 'contrast(1.5) saturate(1.2) brightness(1.1)';
            refCtx.drawImage(c, 0, 0, ref.width, ref.height);
            refCtx.restore();
          }

          if ($('#crosshair').checked && currentGuide) {
            refCtx.strokeStyle = 'rgba(79,70,229,0.7)';
            refCtx.lineWidth = 1;
            refCtx.beginPath();
            refCtx.moveTo(currentGuide.x, 0);
            refCtx.lineTo(currentGuide.x, ref.height);
            refCtx.moveTo(0, currentGuide.y);
            refCtx.lineTo(ref.width, currentGuide.y);
            refCtx.stroke();
          }
        }

        function updateStage() {
          const scale = currentScale();
          ref.style.width = `${draw.width * scale}px`;
          ref.style.height = `${draw.height * scale}px`;
          draw.style.width = `${draw.width * scale}px`;
          draw.style.height = `${draw.height * scale}px`;
          ref.style.transform = 'translate(-50%, -50%)';
          draw.style.transform = 'translate(-50%, -50%)';
        }

        function loadImageFile(file) {
          if (!file || !file.type.startsWith('image/')) {
            say('Please choose a valid image file.');
            return;
          }

          const reader = new FileReader();
          reader.onload = () => {
            const url = reader.result;
            const img = new Image();
            img.onload = () => {
              image = img;
              sourceData = url;
              const width = Math.max(400, Math.min(1600, img.width));
              const height = Math.max(300, Math.min(1200, img.height));
              resizeCanvas(width, height, false);
              ctx.clearRect(0, 0, draw.width, draw.height);
              fitImageToStage();
              drawReference();
              autosave();
              say('Picture loaded — ready to trace');
            };
            img.src = url;
          };
          reader.readAsDataURL(file);
        }

        function setStroke(value) {
          ctx.lineWidth = Number(value);
        }

        function handlePointerDown(e) {
          pointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
          const pos = pointFromEvent(e);
          start = pos;
          active = true;
          moving = false;

          if ($('#tool').value === 'eraser') {
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
          } else {
            ctx.restore && ctx.restore();
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = Number($('#strokeWidth').value);
            ctx.globalCompositeOperation = 'source-over';
          }

          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        }

        function handlePointerMove(e) {
          if (pointerMap.has(e.pointerId)) {
            pointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
          }

          if (!active) {
            currentGuide = pointFromEvent(e);
            drawReference();
            return;
          }

          const pos = pointFromEvent(e);
          const tool = $('#tool').value;

          if (tool === 'eraser') {
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = Number($('#strokeWidth').value) * 2;
          } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.lineWidth = Number($('#strokeWidth').value);
          }

          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
          moving = true;
          currentGuide = pos;
          drawReference();
        }

        function handlePointerUp(e) {
          if (pointerMap.has(e.pointerId)) pointerMap.delete(e.pointerId);
          if (!active) return;
          active = false;
          if (moving) {
            pushHistory();
            moving = false;
            autosave();
          }
        }

        function restoreSession() {
          try {
            const saved = JSON.parse(localStorage.getItem('project-bob-session') || 'null');
            if (!saved) return;

            if (saved.opacity) $('#opacity').value = saved.opacity;
            if (saved.contrast) $('#contrast').value = saved.contrast;
            if (saved.zoom) {
              zoom = Number(saved.zoom);
            }

            if (saved.drawing) {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const c = canvas.getContext('2d');
                c.drawImage(img, 0, 0);
                ctx.clearRect(0, 0, draw.width, draw.height);
                ctx.drawImage(canvas, 0, 0, draw.width, draw.height);
              };
              img.src = saved.drawing;
            }

            if (saved.image) {
              const img = new Image();
              img.onload = () => {
                image = img;
                sourceData = saved.image;
                const maxW = Math.max(500, ws.clientWidth * 0.9);
                const maxH = Math.max(400, ws.clientHeight * 0.8);
                const scale = Math.min(maxW / img.width, maxH / img.height, 1.8);
                baseScale = scale;
                updateStage();
                drawReference();
              };
              img.src = saved.image;
            }
          } catch (error) {
            console.warn('Could not restore local session', error);
          }
        }

        function exportPNG() {
          const a = document.createElement('a');
          const dataURL = draw.toDataURL('image/png');
          a.href = dataURL;
          a.download = 'project-bob-trace.png';
          a.click();
          say('PNG downloaded');
        }

        function handleUndo() {
          if (!history.length) return;
          redoStack.push(ctx.getImageData(0, 0, draw.width, draw.height));
          const snapshot = history.pop();
          restoreHistory(snapshot);
          $('#undo').disabled = history.length === 0;
          $('#redo').disabled = redoStack.length === 0;
          autosave();
        }

        function handleRedo() {
          if (!redoStack.length) return;
          history.push(ctx.getImageData(0, 0, draw.width, draw.height));
          const snapshot = redoStack.pop();
          restoreHistory(snapshot);
          $('#undo').disabled = history.length === 0;
          $('#redo').disabled = redoStack.length === 0;
          autosave();
        }

        function setupEvents() {
          $('#upload').addEventListener('click', () => $('#file').click());
          $('#file').addEventListener('change', (e) => loadImageFile(e.target.files[0]));

          $('#tool').addEventListener('change', () => {
            say(`Using ${$('#tool').value} tool`);
          });

          $('#strokeWidth').addEventListener('input', (e) => setStroke(e.target.value));
          $('#opacity').addEventListener('input', () => drawReference());
          $('#contrast').addEventListener('input', () => drawReference());
          $('#edge').addEventListener('change', drawReference);
          $('#mirror').addEventListener('change', drawReference);
          $('#ghost').addEventListener('change', () => {
            if ($('#ghost').checked) {
              say('Ghost guide on');
            } else {
              say('Ghost guide off');
            }
          });
          $('#crosshair').addEventListener('change', drawReference);
          $('#scaleNumber').addEventListener('change', () => {
            const value = Number($('#scaleNumber').value) / 100;
            setZoom(value);
          });

          $('#fitBtn').addEventListener('click', fitImageToStage);
          $('#saveBtn').addEventListener('click', exportPNG);
          $('#undo').addEventListener('click', handleUndo);
          $('#redo').addEventListener('click', handleRedo);
          $('#clear').addEventListener('click', clearCanvas);

          draw.addEventListener('pointerdown', handlePointerDown);
          draw.addEventListener('pointermove', handlePointerMove);
          draw.addEventListener('pointerup', handlePointerUp);
          draw.addEventListener('pointerleave', handlePointerUp);
          draw.addEventListener('pointercancel', handlePointerUp);

          ws.addEventListener('wheel', (e) => {
            if (!image) return;
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.92 : 1.08;
            setZoom(delta, e.clientX - ws.getBoundingClientRect().left, e.clientY - ws.getBoundingClientRect().top);
          }, { passive: false });
        }

        function init() {
          resizeCanvas(900, 620, false);
          setupEvents();
          restoreSession();
          $('#undo').disabled = true;
          $('#redo').disabled = true;
          currentGuide = { x: draw.width / 2, y: draw.height / 2 };
          drawReference();
        }

        init();
      })();
    </script>
  </body>
</html>
