<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827">
<title>Tracing Canvas Studio</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#eef2f8}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden}.app{height:100%;height:100dvh;display:flex;flex-direction:column}header{z-index:3;background:#101827;color:white;padding:8px 12px;box-shadow:0 4px 16px #1113}.top,.toolbar,.group,.zoom,.featurePanel,.footer{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:6px}.brand{font-weight:750}.toolbar{justify-content:center}.group{padding:4px 7px;border:1px solid #ffffff24;border-radius:10px;background:#ffffff0b}label{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;white-space:nowrap}input[type=range]{width:75px;accent-color:#72a2ff}input[type=color]{height:28px;width:30px;padding:0;border:0;background:transparent}button,select{min-height:34px;padding:6px 9px;border:0;border-radius:8px;background:#3978f6;color:white;font:inherit;font-size:.78rem;font-weight:650;cursor:pointer;touch-action:manipulation}button.secondary,select{background:#e8edf5;color:#182235}button.active{background:#f3b73f;color:#172033}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffc857;outline-offset:2px}.featurePanel{display:none;max-height:34vh;overflow:auto;padding:7px 2px 2px;border-top:1px solid #ffffff25;margin-top:7px}.featurePanel.open{display:flex}.featurePanel details{min-width:170px;max-width:260px;align-self:flex-start;border:1px solid #ffffff2a;border-radius:9px;padding:6px 8px;background:#ffffff0a}.featurePanel summary{cursor:pointer;font-size:.78rem;font-weight:700}.featurePanel details .items{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.featurePanel label{font-size:.72rem;color:#eff4fc}.featurePanel input[type=range]{width:65px}.featurePanel button{font-size:.72rem;min-height:30px}.featurePanel select{max-width:145px;font-size:.72rem;min-height:30px}.hint{font-size:.74rem;color:#bdc9 @media(max-width:850px){header{padding:7px}.toolbar{gap:4px}.group{padding:3px 5px}label{font-size:.69rem}input[type=range]{width:58px}.featurePanel{max-height:30vh}}@media(max-width:560px){.top{justify-content:center}.brand{text-align:center;width:100%}.toolbar{max-height:22vh;overflow:auto}.group{justify-content:center}.featurePanel details{min-width:145px;flex:1}.footer{justify-content:center;text-align:center}.hint{display:none}}
</style>
</head>
<body>
<main class="app" id="app">
<header><div class="top"><div class="brand">✏️ Tracing Canvas Studio</div><div class="hint">30 creative tracing tools · work autosaves on this device</div><button id="featuresBtn" type="button">✨ Studio tools</button></div>
<div class="toolbar">
<div class="group"><label>Tool <select id="tool"><option value="pencil">Pencil</option><option value="eraser">Eraser</option><option value="line">Line</option><option value="rectangle">Rectangle</option><option value="ellipse">Ellipse</option></select></label><label>Color <input id="color" type="color" value="#172033"></label><label>Size <input id="size" type="range" min="1" max="40" value="4"><span id="sizeText">4</span></label><label>Ink <input id="ink" type="range" min=".1" max="1" step=".05" value="1"></label></div>
<div class="group"><label>Image <input id="opacity" type="range" min="0" max="1" step=".01" value=".65"></label><label>Contrast <input id="contrast" type="range" min=".5" max="2.5" step=".05" value="1"></label><label>Screen <input id="brightness" type="range" min=".6" max="1.6" step=".05" value="1"></label></div>
<div class="group"><button id="upload" class="secondary">Add reference</button><button id="undo" class="secondary" disabled>Undo</button><button id="redo" class="secondary" disabled>Redo</button><button id="clear" class="secondary">Clear</button><button id="save" class="secondary">Save PNG</button><button id="move" class="secondary">Move</button><button id="fullscreen" class="secondary">Fullscreen</button><button id="wake">Keep screen on</button></div>
</div>
<div id="featurePanel" class="featurePanel">
<details open><summary>Reference magic</summary><div class="items"><label><input id="edge" type="checkbox"> Edge tracing</label><label><input id="pencilMode" type="checkbox"> Pencil-friendly</label><label><input id="ghost" type="checkbox"> Ghost pulse</label><label><input id="mirror" type="checkbox"> Mirror reference</label><label><input id="spot" type="checkbox"> Pencil spotlight</label><label><input id="isolate" type="checkbox"> Isolate color</label><label>Palette <input id="isolateColor" type="color" value="#e04848"></label><label><input id="stencil" type="checkbox"> Stencil</label><label><input id="paint" type="checkbox"> Numbered-color look</label><label><input id="easier" type="checkbox"> Make it easier</label><label><input id="blink" type="checkbox"> Compare blink</label></div></details>
<details><summary>Composition & guides</summary><div class="items"><label><input id="symmetry" type="checkbox"> Mirror strokes</label><label>Repeat <input id="radial" type="number" min="1" max="24" value="1" style="width:45px"></label><button id="radialApply" class="secondary">Radial strokes on</button><label><input id="crosshair" type="checkbox"> Crosshair</label><label><input id="ruler" type="checkbox"> Rulers</label><button id="proportion" class="secondary">Measure ratio</button><button id="perspective" class="secondary">4-corner correct</button><button id="rotate" class="secondary">Rotate 90°</button><button id="align" class="secondary">Alignment locked</button><label>Paper <select id="paper"><option value="none">No paper guide</option><option value="a4">A4 portrait</option><option value="letter">Letter portrait</option><option value="a3">A3 portrait</option></select></label><button id="tilePrint" class="secondary">Print tiled pages</button></div></details>
<details><summary>Play & learn</summary><div class="items"><label>Challenge <select id="challenge"><option value="off">Off</option><option value="quarter">Hide ¼</option><option value="half">Hide ½</option><option value="most">Hide most</option></select></label><button id="coach" class="secondary">Guided coach</button><button id="replay" class="secondary">Replay strokes</button><button id="record" class="secondary">Make time-lapse</button><button id="voice" class="secondary">Voice controls</button><button id="lightbox" class="secondary">Lightbox</button><label>Gesture <select id="edgeGesture"><option value="off">Edge gestures off</option><option value="on">Edge gestures on</option></select></label></div></details>
<details><summary>Pages, presets & export</summary><div class="items"><button id="addPage" class="secondary">New reference page</button><button id="prevPage" class="secondary">◀ Page</button><span id="pageLabel">Page 1</span><button id="nextPage" class="secondary">Page ▶</button><button id="savePreset" class="secondary">Save preset</button><select id="presets" aria-label="Load settings preset"><option value="">Load preset…</option></select><button id="transparent" class="secondary">Export drawing only</button><button id="lineStyle" class="secondary">Outline style</button></div></details>
</div></header>
<section id="workspace" aria-label="Tracing workspace"><div id="stage"><canvas id="reference" class="layer"></canvas><canvas id="drawing" class="layer" tabindex="0" aria-label="Drawing surface"></canvas><canvas id="guideCanvas" class="layer"></canvas></div><div id="challengeGrid" class="coverGrid" hidden></div><div id="guideBadge" class="guideBadge" hidden></div><input id="file" class="sr" type="file" accept="image/*" multiple></section>
<div class="zoom"><button id="zoomOut" class="secondary">−</button><span id="zoomLabel">100%</span><button id="zoomIn" class="secondary">+</button><button id="fit" class="secondary">Fit</button></div><footer class="footer"><span>Touch/mouse to draw · pinch or Ctrl+wheel to zoom · Move to pan</span><span id="status" class="status" role="status" aria-live="polite">Ready</span></footer></main>
<script>
(()=>{
const $=s=>document.querySelector(s), ref=$('#reference'), draw=$('#drawing'), guides=$('#guideCanvas'), stage=$('#stage'), ws=$('#workspace'), rctx=ref.getContext('2d'), ctx=draw.getContext('2d'), gctx=guides.getContext('2d');
const DB='tracing-studio-v3', MAX=6, history=[], redoHistory=[], pages=[];let image=null,sourceData=null,zoom=1,active=false,moving=false,panMode=false,start=null,preview=null,pointers=new Map(),pinch=null,wakeLock=null,keepAwake=false,mirrorStrokes=false,radialCount=1,shapePath=[],recording=false,mediaRecorder=null,recorded=[],measurePoints=[],perspectivePoints=[],perspectiveMode=false,coachStep=0,ghostTimer=null,compareTimer=null,spotOn=false,guidePoint=null,lastFeature=null;
const status=$('#status'), setStatus=s=>status.textContent=s;
function session(){return{imageData:sourceData,w:draw.width,h:draw.height,drawing:draw.toDataURL(),zoom,settings:readSettings()}}
function readSettings(){return{opacity:$('#opacity').value,contrast:$('#contrast').value,brightness:$('#brightness').value,size:$('#size').value,ink:$('#ink').value,color:$('#color').value,tool:$('#tool').value,mirror:$('#mirror').checked,pencil:$('#pencilMode').checked,edge:$('#edge').checked,stencil:$('#stencil').checked,paint:$('#paint').checked}}
function saveLocal(){try{localStorage.setItem('tracing-studio-session',JSON.stringify(session()))}catch(_){setStatus('Autosave storage is full; export a PNG to protect your work.')}}
let saveTimer;function autosave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveLocal,400)}
function sizeCanvas(w,h,preserve=true){let old=null;if(preserve&&draw.width){old=document.createElement('canvas');old.width=draw.width;old.height=draw.height;old.getContext('2d').drawImage(draw,0,0)}w=Math.max(1,Math.round(w));h=Math.max(1,Math.round(h));for(const c of [ref,draw,guides]){c.width=w;c.height=h;c.style.width=w+'px';c.style.height=h+'px'}if(old)ctx.drawImage(old,0,0,old.width,old.height,0,0,w,h);updateStage();drawReference();drawGuides();history.length=0;redoHistory.length=0;pushHistory()}
function updateStage(){stage.style.width=Math.max(1,draw.width*zoom)+'px';stage.style.height=Math.max(1,draw.height*zoom)+'px';stage.style.setProperty('--zoom',zoom);$('#zoomLabel').textContent=Math.round(zoom*100)+'%'}
function processImage(img){const c=document.createElement('canvas');c.width=draw.width;c.height=draw.height;const x=c.getContext('2d');x.save();if($('#mirror').checked){x.translate(c.width,0);x.scale(-1,1)}x.filter=`contrast(${$('#contrast').value}) brightness(${($('#pencilMode').checked?1.35:1)*($('#easier').checked?1.2:1)}) saturate(${($('#pencilMode').checked||$('#easier').checked)?0.35:1})`;x.drawImage(img,0,0,c.width,c.height);x.restore();if($('#edge').checked||$('#stencil').checked||$('#paint').checked||$('#isolate').checked){let im=x.getImageData(0,0,c.width,c.height),d=im.data,w=c.width,h=c.height,copy=new Uint8ClampedArray(d);const edge=$('#edge').checked,stencil=$('#stencil').checked,paint=$('#paint').checked,isolate=$('#isolate').checked,target=$('#isolateColor').value;let tr=parseInt(target.slice(1,3),16),tg=parseInt(target.slice(3,5),16),tb=parseInt(target.slice(5,7),16);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let i=(y*w+xx)*4,r=copy[i],g=copy[i+1],b=copy[i+2],gray=.299*r+.587*g+.114*b;if(isolate&&Math.hypot(r-tr,g-tg,b-tb)>105){d[i]=d[i+1]=d[i+2]=255;continue}if(edge){let ir=(y*w+Math.min(w-1,xx+1))*4,ib=(Math.min(h-1,y+1)*w+xx)*4,diff=Math.abs(gray-(.299*copy[ir]+.587*copy[ir+1]+.114*copy[ir+2]))+Math.abs(gray-(.299*copy[ib]+.587*copy[ib+1]+.114*copy[ib+2]));let v=diff>35?20:255;d[i]=d[i+1]=d[i+2]=v}else if(stencil){let v=gray<150?0:255;d[i]=d[i+1]=d[i+2]=v}else if(paint){let levels=4;d[i]=Math.round(r/255*levels)*255/levels;d[i+1]=Math.round(g/255*levels)*255/levels;d[i+2]=Math.round(b/255*levels)*255/levels}}x.putImageData(im,0,0)}return c}
function drawReference(){rctx.clearRect(0,0,ref.width,ref.height);if(!image)return;let c=processImage(image);rctx.globalAlpha=Number($('#opacity').value);rctx.drawImage(c,0,0);rctx.globalAlpha=1;if($('#paint').checked){rctx.save();rctx.fillStyle='#d92323';rctx.font=`bold ${Math.max(12,Math.round(ref.width/45))}px sans-serif`;for(let y=30;y<ref.height;y+=Math.max(60,ref.height/5))for(let x=30;x<ref.width;x+=Math.max(60,ref.width/5))rctx.fillText(String((Math.floor(x/60)+Math.floor(y/60))%4+1),x,y);rctx.restore()}ref.style.opacity=$('#ghost').checked?String(.45+.45*(Math.sin(Date.now()/450)+1)/2):'1';ref.style.filter=spotOn?'':'none';if(spotOn&&guidePoint){ref.style.maskImage=`radial-gradient(circle 150px at ${guidePoint.x}px ${guidePoint.y}px,black 0 70%,transparent 100%)`;ref.style.webkitMaskImage=ref.style.maskImage}else{ref.style.maskImage='';ref.style.webkitMaskImage=''}updateChallenge()}
function fit(img=image){if(!img)return;const ratio=Math.min((ws.clientWidth-40)/img.width,(ws.clientHeight-40)/img.height,1);sizeCanvas(img.width*ratio,img.height*ratio,false);zoom=1;updateStage();ws.scrollTo(0,0);autosave()}
function loadFile(file){if(!file||!file.type.startsWith('image/'))return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{image=im;sourceData=fr.result;fit(im);setStatus('Reference loaded · autosave active')};im.src=fr.result};fr.readAsDataURL(file)}
function pushHistory(){try{history.push(ctx.getImageData(0,0,draw.width,draw.height));if(history.length>18)history.shift();redoHistory.length=0;buttons()}catch(_){}}
function buttons(){$('#undo').disabled=history.length<2;$('#redo').disabled=!redoHistory.length}
function undo(){if(history.length<2)return;redoHistory.push(history.pop());ctx.putImageData(history[history.length-1],0,0);buttons();autosave()}
function redo(){if(!redoHistory.length)return;history.push(redoHistory.pop());ctx.putImageData(history.at(-1),0,0);buttons();autosave()}
function zoomTo(z,x=ws.clientWidth/2,y=ws.clientHeight/2){let old=zoom;zoom=Math.max(.2,Math.min(MAX,z));let px=(ws.scrollLeft+x)/old,py=(ws.scrollTop+y)/old;updateStage();ws.scrollLeft=Math.max(0,px*zoom-x);ws.scrollTop=Math.max(0,py*zoom-y);autosave()}
function point(e){let r=draw.getBoundingClientRect();return{x:(e.clientX-r.left)*draw.width/r.width,y:(e.clientY-r.top)*draw.height/r.height}}
function applyStrokeSegment(a,b){const n=Math.max(1,radialCount),cx=draw.width/2,cy=draw.height/2;for(let i=0;i<n;i++){ctx.save();ctx.translate(cx,cy);ctx.rotate(i*2*Math.PI/n);if(mirrorStrokes&&i%2){ctx.scale(-1,1)}ctx.translate(-cx,-cy);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}}
function paintStyle(){ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=Number($('#size').value);ctx.globalAlpha=Number($('#ink').value);ctx.globalCompositeOperation=$('#tool').value==='eraser'?'destination-out':'source-over';ctx.strokeStyle=$('#tool').value==='eraser'?'#000':$('#color').value}
function shape(p){ctx.save();ctx.globalAlpha=Number($('#ink').value);ctx.strokeStyle=$('#color').value;ctx.lineWidth=Number($('#size').value);ctx.beginPath();let t=$('#tool').value;if(t==='line'){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y)}else if(t==='rectangle')ctx.rect(start.x,start.y,p.x-start.x,p.y-start.y);else ctx.ellipse((start.x+p.x)/2,(start.y+p.y)/2,Math.abs(p.x-start.x)/2,Math.abs(p.y-start.y)/2,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
function handleDown(e){pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(e.pointerType==='touch'&&!$('#touchToggle').checked)return;if(perspectiveMode){perspectivePoints.push(point(e));setStatus(`Perspective corner ${perspectivePoints.length}/4`);if(perspectivePoints.length===4)correctPerspective();return}if(pointers.size===2){active=false;const p=[...pointers.values()];pinch={dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),zoom};return}draw.setPointerCapture(e.pointerId);if(panMode||e.button===1||e.shiftKey){moving=true;start={x:e.clientX,y:e.clientY};return}active=true;start=point(e);preview=ctx.getImageData(0,0,draw.width,draw.height);ctx.save();paintStyle();if(['pencil','eraser'].includes($('#tool').value)){ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(start.x+.01,start.y+.01);ctx.stroke()}ctx.restore();e.preventDefault()}
function handleMove(e){if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(spotOn){let r=ref.getBoundingClientRect();guidePoint={x:e.clientX-r.left,y:e.clientY-r.top};drawReference()}if($('#crosshair').checked){guidePoint=point(e);drawGuides()}if(pinch&&pointers.size>=2){let p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),r=ws.getBoundingClientRect();zoomTo(pinch.zoom*d/pinch.dist,(p[0].x+p[1].x)/2-r.left,(p[0].y+p[1].y)/2-r.top);return}if(moving){ws.scrollLeft-=e.clientX-start.x;ws.scrollTop-=e.clientY-start.y;start={x:e.clientX,y:e.clientY};return}if(!active)return;let p=point(e),t=$('#tool').value;if(['pencil','eraser'].includes(t)){ctx.save();paintStyle();ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore()}else{ctx.putImageData(preview,0,0);shape(p)}e.preventDefault()}
function handleUp(e){pointers.delete(e.pointerId);if(pinch){pinch=null;return}if(active){active=false;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';pushHistory();autosave()}moving=false;if(draw.hasPointerCapture(e.pointerId))draw.releasePointerCapture(e.pointerId)}
draw.addEventListener('pointerdown',handleDown);draw.addEventListener('pointermove',handleMove);draw.addEventListener('pointerup',handleUp);draw.addEventListener('pointercancel',handleUp);
function drawGuides(){gctx.clearRect(0,0,guides.width,guides.height);gctx.save();gctx.strokeStyle='#e44747aa';gctx.lineWidth=Math.max(1,draw.width/900);gctx.setLineDash([6,5]);if($('#crosshair').checked&&guidePoint){gctx.beginPath();gctx.moveTo(guidePoint.x,0);gctx.lineTo(guidePoint.x,draw.height);gctx.moveTo(0,guidePoint.y);gctx.lineTo(draw.width,guidePoint.y);gctx.stroke()}if($('#ruler').checked){gctx.setLineDash([]);for(let x=0;x<draw.width;x+=50){gctx.beginPath();gctx.moveTo(x,0);gctx.lineTo(x,x%100===0?18:9);gctx.stroke()}for(let y=0;y<draw.height;y+=50){gctx.beginPath();gctx.moveTo(0,y);gctx.lineTo(y%100===0?18:9,y);gctx.stroke()}}gctx.restore()}
function showToast(t){let b=$('#guideBadge');b.textContent=t;b.hidden=false;setTimeout(()=>b.hidden=true,3200)}
function updateChallenge(){let mode=$('#challenge').value,grid=$('#challengeGrid');grid.innerHTML='';grid.hidden=mode==='off';ws.classList.toggle('challengeOn',mode!=='off');if(mode==='off')return;let n=mode==='quarter'?4:mode==='half'?8:16,hide=mode==='quarter'?1:mode==='half'?4:12;grid.style.gridTemplateColumns=`repeat(4,1fr)`;for(let i=0;i<n;i++){let d=document.createElement('div');if(i>=n-hide)d.style.visibility='hidden';grid.append(d)}}
function homography(src,w,h){const A=[];for(let i=0;i<4;i++){let{x,y}=src[i],u=i===1||i===2?w:0,v=i>=2?h:0;A.push([x,y,1,0,0,0,-u*x,-u*y,u],[0,0,0,x,y,1,-v*x,-v*y,v])}for(let i=0;i<8;i++){let pivot=A[i][i];if(Math.abs(pivot)<1e-8)return null;for(let j=i;j<9;j++)A[i][j]/=pivot;for(let k=0;k<8;k++)if(k!==i){let f=A[k][i];for(let j=i;j<9;j++)A[k][j]-=f*A[i][j]}}return A.map(row=>row[8])}
