<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Tracing Canvas</title>
    <style>
      :root {
        --bg: #f3f5f9;
        --panel: rgba(17, 17, 17, 0.96);
        --panel-2: #1d1d1d;
        --primary: #2b6bf6;
        --primary-strong: #1f57d7;
        --secondary: #e8ecf3;
        --secondary-text: #1c2430;
        --text: #ffffff;
        --muted: #dfe6f0;
        --shadow: rgba(15, 23, 42, 0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--secondary-text);
      }

      body {
        min-height: 100vh;
      }

      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 16px;
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 8px 20px var(--shadow);
        position: relative;
        z-index: 2;
      }

      .brand {
        font-weight: 700;
        letter-spacing: 0.02em;
        font-size: 1.05rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-left: auto;
      }

      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        padding: 6px 10px;
      }

      .dropHint {
        color: var(--muted);
        font-size: 0.88rem;
        opacity: 0.9;
        white-space: nowrap;
      }

      .control {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text);
        font-size: 0.8rem;
      }

      input[type="range"] {
        width: 120px;
        accent-color: var(--primary);
      }

      button,
      .uploadButton {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 8px 12px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease, opacity 0.2s ease;
        background: var(--primary);
        color: #fff;
      }

      button:hover,
      .uploadButton:hover {
        filter: brightness(1.04);
      }

      button:active,
      .uploadButton:active {
        transform: translateY(1px);
      }

      button.secondary {
        background: var(--secondary);
        color: var(--secondary-text);
      }

      button.ghost {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #canvasWrap {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f0f2f5, #ffffff);
        min-height: 260px;
        overflow: hidden;
        touch-action: none;
        transition: filter 0.1s ease;
      }

      #canvasWrap::before {
        content: "Drop an image here or click to upload";
        position: absolute;
        inset: auto auto 28px 50%;
        transform: translateX(-50%);
        color: rgba(31, 41, 55, 0.6);
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      #canvasWrap.hasImage::before {
        opacity: 0;
      }

      canvas {
        position: absolute;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        display: block;
        background: transparent;
        box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
        border-radius: 10px;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      footer {
        background: #f8fafc;
        border-top: 1px solid rgba(148, 163, 184, 0.3);
        color: #334155;
        font-size: 0.9rem;
        padding: 12px 16px 14px;
        line-height: 1.5;
      }

      @media (max-width: 760px) {
        header {
          padding: 10px 12px;
        }

        .toolbar {
          width: 100%;
          justify-content: space-between;
          margin-left: 0;
        }

        .toolbar-group {
          width: 100%;
          justify-content: center;
        }

        input[type="range"] {
          flex: 1 1 110px;
          min-width: 90px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">Tracing Canvas</div>
        <div class="dropHint">Drag &amp; drop an image onto the canvas</div>

        <div class="toolbar">
          <div class="toolbar-group">
            <label class="control" for="opacity" title="Image opacity for tracing">
              Opacity
              <input id="opacity" type="range" min="0" max="10" step="0.1" value="1" />
            </label>
            <label class="control" for="brightness" title="Screen brightness for pencil tracing">
              Brightness
              <input id="brightness" type="range" min="0.5" max="3" step="0.1" value="1" />
            </label>
            <label class="control" for="brushSize" title="Brush thickness">
              Brush
              <input id="brushSize" type="range" min="1" max="20" step="1" value="4" />
            </label>
          </div>

          <div class="toolbar-group">
            <label class="control" style="color:#fff;" for="touchToggle">
              <input id="touchToggle" type="checkbox" checked /> Touch Draw
            </label>
            <button id="uploadBtn" class="uploadButton secondary" type="button">Upload</button>
            <button id="clearBtn" class="secondary" type="button">Clear</button>
            <button id="downloadBtn" class="ghost" type="button">Download</button>
            <button id="lockBtn" type="button">Lock Touch: Off</button>
          </div>
        </div>
      </header>

      <div id="canvasWrap" aria-label="Tracing area" role="application">
        <canvas id="bg" aria-hidden="true"></canvas>
        <canvas id="overlay" aria-label="Drawing canvas"></canvas>
      </div>

      <footer>
        Use a pencil on paper over your screen to trace. Toggle “Touch Draw” off to prevent drawing when the paper touches the screen.
      </footer>
    </div>

    <input id="fileInput" class="sr-only" type="file" accept="image/*" />

    <script>
      (function () {
        const bg = document.getElementById('bg');
        const overlay = document.getElementById('overlay');
        const wrap = document.getElementById('canvasWrap');
        const opacityInput = document.getElementById('opacity');
        const brightnessInput = document.getElementById('brightness');
        const brushSizeInput = document.getElementById('brushSize');
        const clearBtn = document.getElementById('clearBtn');
        const lockBtn = document.getElementById('lockBtn');
        const touchToggle = document.getElementById('touchToggle');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('downloadBtn');

        const bgCtx = bg.getContext('2d', { alpha: true });
        const ctx = overlay.getContext('2d', { alpha: true });

        let img = null;
        let isDrawing = false;
        let last = { x: 0, y: 0 };
        let locked = false;
        let touchEnabled = true;
        let pointerActive = false;

        function setCanvasSize(w, h) {
          bg.width = w;
          bg.height = h;
          overlay.width = w;
          overlay.height = h;

          bg.style.width = `${w}px`;
          bg.style.height = `${h}px`;
          overlay.style.width = `${w}px`;
          overlay.style.height = `${h}px`;

          overlay.style.position = 'absolute';
          bg.style.position = 'absolute';
        }

        function resizeCanvases(width, height) {
          const containerW = Math.max(200, wrap.clientWidth * 0.95);
          const containerH = Math.max(180, wrap.clientHeight * 0.95);
          const w = width || containerW;
          const h = height || containerH;

          setCanvasSize(w, h);
        }

        function updateWrapState() {
          wrap.classList.toggle('hasImage', !!img);
        }

        function applyCanvasBrightness() {
          const brightness = parseFloat(brightnessInput.value) || 1;
          wrap.style.filter = `brightness(${brightness})`;
        }

        function drawBackgroundImage() {
          if (!img) return;
          bgCtx.clearRect(0, 0, bg.width, bg.height);
          bgCtx.filter = `brightness(${parseFloat(opacityInput.value) || 1})`;
          bgCtx.drawImage(img, 0, 0, bg.width, bg.height);
          bgCtx.filter = 'none';
        }

        function fitImageToCanvas(image) {
          const maxW = Math.min(window.innerWidth - 40, image.width);
          const maxH = Math.min(window.innerHeight - 120, image.height);
          const ratio = Math.min(maxW / image.width, maxH / image.height, 1);
          const w = Math.max(220, Math.round(image.width * ratio));
          const h = Math.max(180, Math.round(image.height * ratio));

          resizeCanvases(w, h);
          drawBackgroundImage();
          ctx.clearRect(0, 0, overlay.width, overlay.height);
        }

        function handleImageFile(file) {
          if (!file || !file.type.startsWith('image/')) return;

          const reader = new FileReader();
          reader.onload = (e) => {
            const imgEl = new Image();
            imgEl.onload = () => {
              img = imgEl;
              fitImageToCanvas(imgEl);
              updateWrapState();
            };
            imgEl.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }

        function clearDrawing() {
          ctx.clearRect(0, 0, overlay.width, overlay.height);
        }

        function getCanvasPoint(event) {
          const rect = overlay.getBoundingClientRect();
          const clientX = event.clientX ?? (event.touches && event.touches[0] ? event.touches[0].clientX : 0);
          const clientY = event.clientY ?? (event.touches && event.touches[0] ? event.touches[0].clientY : 0);

          return {
            x: (clientX - rect.left) * (overlay.width / rect.width),
            y: (clientY - rect.top) * (overlay.height / rect.height)
          };
        }

        function beginStroke(event) {
          if (event.pointerType === 'touch' && !touchEnabled) {
            return;
          }

          isDrawing = true;
          pointerActive = true;
          last = getCanvasPoint(event);

          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          ctx.lineWidth = Number(brushSizeInput.value) || 4;
          ctx.strokeStyle = '#000';
          ctx.beginPath();
          ctx.moveTo(last.x, last.y);

          if (typeof event.preventDefault === 'function') {
            event.preventDefault();
          }
        }

        function continueStroke(event) {
          if (!isDrawing || !pointerActive) return;
          const p = getCanvasPoint(event);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
          last = p;

          if (typeof event.preventDefault === 'function') {
            event.preventDefault();
          }
        }

        function endStroke(event) {
          if (!isDrawing) return;
          isDrawing = false;
          pointerActive = false;
          ctx.closePath();

          if (event && typeof event.preventDefault === 'function') {
            event.preventDefault();
          }
        }

        function attachPointerListeners() {
          overlay.addEventListener('pointerdown', beginStroke);
          overlay.addEventListener('pointermove', continueStroke);
          overlay.addEventListener('pointerup', endStroke);
          overlay.addEventListener('pointerleave', endStroke);
          overlay.addEventListener('pointercancel', endStroke);
        }

        function detachPointerListeners() {
          overlay.removeEventListener('pointerdown', beginStroke);
          overlay.removeEventListener('pointermove', continueStroke);
          overlay.removeEventListener('pointerup', endStroke);
          overlay.removeEventListener('pointerleave', endStroke);
          overlay.removeEventListener('pointercancel', endStroke);
        }

        function setLocked(v) {
          locked = !!v;
          lockBtn.textContent = `Lock Touch: ${locked ? 'On' : 'Off'}`;

          if (locked) {
            document.addEventListener('touchmove', preventDefaultTouch, { passive: false });
            document.addEventListener('touchstart', preventDoubleTouchZoom, { passive: false });
            document.addEventListener('gesturestart', preventDefaultTouch);
            document.body.style.overflow = 'hidden';
            document.documentElement.style.touchAction = 'none';
          } else {
            document.removeEventListener('touchmove', preventDefaultTouch, { passive: false });
            document.removeEventListener('touchstart', preventDoubleTouchZoom, { passive: false });
            document.removeEventListener('gesturestart', preventDefaultTouch);
            document.body.style.overflow = '';
            document.documentElement.style.touchAction = '';
          }
        }

        function preventDefaultTouch(e) {
          if (e.target === overlay || overlay.contains(e.target)) {
            return;
          }
          e.preventDefault();
        }

        let lastTap = 0;
        function preventDoubleTouchZoom(e) {
          const now = Date.now();
          if (now - lastTap < 300) {
            e.preventDefault();
          }
          lastTap = now;
        }

        function openFilePicker() {
          fileInput.value = '';
          fileInput.click();
        }

        function downloadCanvas() {
          const link = document.createElement('a');
          link.download = 'tracing-canvas.png';
          link.href = overlay.toDataURL('image/png');
          link.click();
        }

        wrap.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'copy';
        });

        wrap.addEventListener('drop', (e) => {
          e.preventDefault();
          const file = e.dataTransfer.files && e.dataTransfer.files[0];
          if (file) {
            handleImageFile(file);
          }
        });

        wrap.addEventListener('click', () => {
          if (!img) {
            openFilePicker();
          }
        });

        opacityInput.addEventListener('input', () => {
          if (img) {
            drawBackgroundImage();
          }
        });

        brightnessInput.addEventListener('input', () => {
          applyCanvasBrightness();
        });

        brushSizeInput.addEventListener('input', () => {
          if (isDrawing) {
            ctx.lineWidth = Number(brushSizeInput.value) || 4;
          }
        });

        fileInput.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) {
            handleImageFile(file);
          }
        });

        clearBtn.addEventListener('click', () => {
          clearDrawing();
        });

        uploadBtn.addEventListener('click', openFilePicker);
        downloadBtn.addEventListener('click', downloadCanvas);
        lockBtn.addEventListener('click', () => setLocked(!locked));

        touchToggle.addEventListener('change', (e) => {
          touchEnabled = !!e.target.checked;
        });

        window.addEventListener('resize', () => {
          if (img) {
            fitImageToCanvas(img);
          } else {
            resizeCanvases(Math.min(window.innerWidth - 40, 800), Math.min(window.innerHeight - 120, 600));
          }
        });

        overlay.tabIndex = 0;
        overlay.style.touchAction = 'none';
        applyCanvasBrightness();
        resizeCanvases(Math.min(window.innerWidth - 40, 800), Math.min(window.innerHeight - 120, 600));
        attachPointerListeners();
      })();
    </script>
  </body>
</html>
